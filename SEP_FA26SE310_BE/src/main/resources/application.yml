server:
  port: ${PORT:8081}
spring:
  application:
    name: fbus-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/fbus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
app:
  jwt-secret: ${JWT_SECRET}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
